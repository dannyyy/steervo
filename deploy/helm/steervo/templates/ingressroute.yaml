{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "steervo.name" . }}
spec:
  entryPoints: [{{ .Values.ingress.entryPoint }}]
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ include "steervo.name" . }}
          port: 80
  tls:
    certResolver: {{ .Values.ingress.certResolver }}
{{- end }}
