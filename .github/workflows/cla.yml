name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/dannyyy/steervo/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'main'
          allowlist: dannyyy,bot*
          create-file-commit-message: 'Create CLA signature store'
          signed-commit-message: '$contributorName signed the CLA in #$pullRequestNo'
          custom-notsigned-prcomment: 'Danke für deinen Beitrag. Steervo ist doppelt lizenziert, deshalb braucht jeder Beitrag deine Zustimmung zum $pathToCLADocument. Bitte lies es und bestätige mit dem unten genannten Satz als Kommentar. Du machst das nur einmal — die Zustimmung gilt auch für künftige Beiträge.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'Alle Beitragenden haben das CLA unterzeichnet. Danke!'
          lock-pullrequest-aftermerge: true
