name: steervo-tests
services:
  postgres17:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      { POSTGRES_USER: steervo, POSTGRES_PASSWORD: steervo-local-only, POSTGRES_DB: steervo }
    ports: ["127.0.0.1:55437:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steervo -d steervo"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres18:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      { POSTGRES_USER: steervo, POSTGRES_PASSWORD: steervo-local-only, POSTGRES_DB: steervo }
    ports: ["127.0.0.1:55438:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steervo -d steervo"]
      interval: 2s
      timeout: 2s
      retries: 30
  mail:
    image: maildev/maildev:3.0.0@sha256:6e09695961f4aef9016a390ad391314a078220216601b15a35d389a7df2a3855
    ports: ["127.0.0.1:52025:1025", "127.0.0.1:52080:1080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1080/api/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
  storage:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment: { COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: steervo-tests }
    mem_limit: 512m
    ports: ["127.0.0.1:55439:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/steervo-tests/"]
      interval: 2s
      timeout: 2s
      retries: 60
