name: steervo
services:
  db:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_USER: steervo
      POSTGRES_DB: steervo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-local.sh first}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["database:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steervo -d steervo"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: maildev/maildev:3.0.0@sha256:6e09695961f4aef9016a390ad391314a078220216601b15a35d389a7df2a3855
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:51080:1080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1080/api/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    image: steervo:local
    profiles: ["app"]
    command: ["--migrate"]
    env_file: .env
    environment:
      ConnectionStrings__Database: Host=db;Port=5432;Database=steervo;Username=steervo;Password=${POSTGRES_PASSWORD}
      DataProtection__Path: /var/steervo/keys
    volumes: ["keys:/var/steervo/keys"]
    depends_on:
      db: { condition: service_healthy }
  app:
    image: steervo:local
    profiles: ["app"]
    env_file: .env
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=db;Port=5432;Database=steervo;Username=steervo;Password=${POSTGRES_PASSWORD}
      DataProtection__Path: /var/steervo/keys
      DocumentStorage__Provider: ${DocumentStorage__Provider:-FileSystem}
      DocumentStorage__Path: /var/steervo/documents
      Smtp__Host: mail
      Smtp__Port: 1025
    ports: ["127.0.0.1:5180:8080"]
    volumes: ["keys:/var/steervo/keys", "documents:/var/steervo/documents"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mail: { condition: service_healthy }
volumes:
  database:
  documents:
  keys:
